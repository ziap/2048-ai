[general]
host = "127.0.0.1"
port = 3000
root = "."

[advanced]

# SharedArrayBuffer is only handed out to cross-origin isolated documents, and
# the pool's task queue lives in one. Without these the app falls back to the
# sequential path.
[[advanced.headers]]
source = "**"
headers.Cross-Origin-Opener-Policy = "same-origin"
headers.Cross-Origin-Embedder-Policy = "require-corp"
